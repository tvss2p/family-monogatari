<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#2a1a22">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="ファミリー物語">
<title>ファミリー物語</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png">
<link rel="icon" href="assets/img/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles/cabinet.css">
<link rel="stylesheet" href="styles/lcd.css">
</head>
<body>
<div id="app">
  <div id="fit">
    <div class="cab gold ph-normal" id="cab">
      <div class="backrays"></div>
      <img class="wing l" src="assets/img/part-wing.webp" alt="">
      <img class="wing r" src="assets/img/part-wing.webp" alt="">
      <div class="frame">
        <div class="pil l metalH"><i class="ledline"></i></div>
        <div class="pil r metalH"><i class="ledline"></i></div>
        <div class="board" id="board">
          <canvas id="boardCanvas"></canvas>
          <div class="lcdf" id="lcdf"><div class="lcd" id="lcd"></div></div>
          <div class="medalwrap"><img src="assets/img/part-nafan.webp" alt=""></div>
          <img class="arm l" src="assets/img/part-arm.webp" alt="">
          <img class="arm r" src="assets/img/part-arm.webp" alt="">
          <img class="jarashi" src="assets/img/part-jarashi.webp" alt="">
          <div class="hold" id="hold"><i></i><i></i><i></i><i></i></div>
          <div class="heso">
            <div class="cup"></div>
            <div class="hwing l"></div><div class="hwing r"></div>
            <div class="plate"><img class="fam" src="assets/img/sym-trio.png" alt=""><img class="ring" src="assets/img/part-heso.webp" alt=""><span>START</span></div>
          </div>
          <img class="wind" src="assets/img/part-windmill.webp" alt="" style="left:52px;top:308px">
          <img class="wind" src="assets/img/part-windmill.webp" alt="" style="left:268px;top:308px">
          <div class="atk" id="atk"></div>
          <div class="flash"></div>
          <div class="glass"></div>
        </div>
      </div>
      <div class="crown" id="crown"><img src="assets/img/cab-crown.webp" alt="ファミリー物語"><i class="heartGlow"></i></div>
      <div class="counter"><div>回転<b id="cSpin">000</b></div><div>大当り<b id="cHit">00</b></div><div><span id="cKl">モード</span><b id="cK" class="off">通常</b></div></div>
      <span class="sparkle" style="left:4px;top:36px">✦</span><span class="sparkle" style="right:6px;top:40px;animation-delay:-.8s">✦</span>
      <div class="bottom">
        <img class="bottomImg" src="assets/img/cab-bottom.webp" alt="">
        <div class="disp"><b id="cBalls">250</b></div>
        <div class="pushwrap" id="pushwrap"><div class="ring"></div><button class="push" id="push" aria-label="PUSH"><img src="assets/img/part-push.webp" alt=""></button></div>
        <div class="b2"><button id="rent">玉貸</button><button id="menu">設定</button></div>
        <div class="handle" id="handle"><div class="arc" id="handleArc"></div><div class="knob" id="knob"><img src="assets/img/part-knob.webp" alt=""><i class="grip"></i></div></div>
        <button class="lock" id="lock" aria-label="ハンドルを固定">固定</button>
        <button class="pstep minus" id="pMinus" aria-label="弱く">−</button>
        <button class="pstep plus" id="pPlus" aria-label="強く">＋</button>
        <div class="powerLabel" id="powerLabel"></div>
      </div>
      <div class="cutin"><div class="band"></div><div class="txt" id="cutinTxt"></div></div>
    </div>
  </div>
  <div class="menu" id="menuPanel">
    <div class="card">
      <b>せってい</b>
      <div class="normalRows"><button id="mSound">効果音：オン</button><button id="mBgm">BGM：オン</button><button id="mReset">データをリセット</button><button id="mClose">とじる</button><p class="credit">音楽・効果音：魔王魂 https://maou.audio/（CC BY 4.0、形式変換・音量調整・一部カットあり）</p></div>
      <div class="confirmRows"><p>もち玉・回転数・大当たりの記録を<br>はじめにもどします。よいですか？</p><button id="mResetNo">やめる</button><button id="mResetYes">リセットする</button></div>
    </div>
  </div>
  <div class="rotate">たてにしてね</div>
</div>
<script type="module" src="src/main.js"></script>
</body>
</html>
